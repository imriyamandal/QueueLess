version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: queueless-db
    environment:
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_secure_password
      POSTGRES_DB: queueless_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queueless-backend
    environment:
      DATABASE_URL: postgresql://queueless:queueless_secure_password@db:5432/queueless_db
      APP_ENV: production
      APP_SECRET_KEY: queueless-production-secret-key-change-me
      FRONTEND_ORIGIN: http://localhost:3000
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: queueless-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
